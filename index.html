<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura — Minimal Authentication</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Firebase Compat CDN scripts (Runs smoothly on file:// and http://) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-top" aria-hidden="true"></div>
  <div class="ambient-glow glow-bottom" aria-hidden="true"></div>

  <!-- Top bar with Theme Switcher -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 2a7 7 0 1 0 7 7" />
        </svg>
      </div>
      <span class="brand-name">Aura</span>
    </div>
    <button id="themeToggle" class="icon-button" aria-label="Toggle theme" title="Toggle Light/Dark Theme">
      <!-- Sun Icon (shown in dark mode) -->
      <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
      <!-- Moon Icon (shown in light mode) -->
      <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>
  </header>

  <!-- Main Container -->
  <main class="main-container">
    <!-- Auth Card -->
    <div id="authCard" class="auth-card">
      <!-- Card Header -->
      <div class="card-header">
        <h1 id="formTitle" class="card-title">Welcome back</h1>
        <p id="formSubtitle" class="card-subtitle">Enter your credentials to access your account</p>
      </div>

      <!-- Segmented Mode Switcher -->
      <div class="segmented-control" role="tablist" aria-label="Authentication mode">
        <button id="tabSignIn" class="segment-btn active" role="tab" aria-selected="true" aria-controls="signInForm">Sign In</button>
        <button id="tabSignUp" class="segment-btn" role="tab" aria-selected="false" aria-controls="signUpForm">Create Account</button>
      </div>

      <!-- Social Logins -->
      <div class="social-login-group">
        <button class="btn-social" type="button" id="googleLoginBtn" aria-label="Continue with Google">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Google</span>
        </button>
        <button class="btn-social" type="button" id="githubLoginBtn" aria-label="Continue with GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
          </svg>
          <span>GitHub</span>
        </button>
        <button class="btn-social" type="button" id="appleLoginBtn" aria-label="Continue with Apple">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.33c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.98.6-2.62 1.35-.57.65-1.06 1.72-.93 2.74 1 .08 2.01-.49 2.62-1.24z"/>
          </svg>
          <span>Apple</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">or continue with email</span>
        <span class="divider-line"></span>
      </div>

      <!-- Sign In Form -->
      <form id="signInForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="signInEmail" class="form-label">Email address</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="signInEmail"
              class="form-input"
              placeholder="alex@example.com"
              autocomplete="email"
              required
            />
          </div>
          <span class="field-error" id="signInEmailError"></span>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="signInPassword" class="form-label">Password</label>
            <button type="button" id="forgotPasswordLink" class="text-link">Forgot password?</button>
          </div>
          <div class="input-wrapper password-wrapper">
            <input
              type="password"
              id="signInPassword"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="toggle-password-btn"
              data-target="signInPassword"
              aria-label="Show password"
              title="Show password"
            >
              <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <span class="field-error" id="signInPasswordError"></span>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="rememberMe" checked />
            <span class="custom-checkbox">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </span>
            <span class="checkbox-label">Keep me signed in</span>
          </label>
        </div>

        <button type="submit" class="btn-primary" id="signInSubmitBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Sign Up Form (hidden by default) -->
      <form id="signUpForm" class="auth-form hidden" novalidate>
        <div class="form-group">
          <label for="signUpName" class="form-label">Full Name</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="signUpName"
              class="form-input"
              placeholder="Alex Morgan"
              autocomplete="name"
              required
            />
          </div>
          <span class="field-error" id="signUpNameError"></span>
        </div>

        <div class="form-group">
          <label for="signUpEmail" class="form-label">Email address</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="signUpEmail"
              class="form-input"
              placeholder="alex@example.com"
              autocomplete="email"
              required
            />
          </div>
          <span class="field-error" id="signUpEmailError"></span>
        </div>

        <div class="form-group">
          <label for="signUpPassword" class="form-label">Password</label>
          <div class="input-wrapper password-wrapper">
            <input
              type="password"
              id="signUpPassword"
              class="form-input"
              placeholder="Min. 8 characters"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="toggle-password-btn"
              data-target="signUpPassword"
              aria-label="Show password"
              title="Show password"
            >
              <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          
          <!-- Password Strength Indicator -->
          <div class="strength-meter-container" id="strengthContainer">
            <div class="strength-bars">
              <div class="strength-bar" id="bar1"></div>
              <div class="strength-bar" id="bar2"></div>
              <div class="strength-bar" id="bar3"></div>
              <div class="strength-bar" id="bar4"></div>
            </div>
            <span class="strength-label" id="strengthLabel">Enter a password</span>
          </div>
          <span class="field-error" id="signUpPasswordError"></span>
        </div>

        <div class="form-group">
          <label for="signUpConfirmPassword" class="form-label">Confirm Password</label>
          <div class="input-wrapper password-wrapper">
            <input
              type="password"
              id="signUpConfirmPassword"
              class="form-input"
              placeholder="Repeat your password"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="toggle-password-btn"
              data-target="signUpConfirmPassword"
              aria-label="Show password"
              title="Show password"
            >
              <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <span class="field-error" id="signUpConfirmError"></span>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="acceptTerms" required />
            <span class="custom-checkbox">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </span>
            <span class="checkbox-label">I agree to the <a href="#" class="inline-link">Terms</a> &amp; <a href="#" class="inline-link">Privacy Policy</a></span>
          </label>
          <span class="field-error" id="termsError"></span>
        </div>

        <button type="submit" class="btn-primary" id="signUpSubmitBtn">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Footer Help / Switch link -->
      <footer class="card-footer">
        <p id="footerText" class="footer-note">
          Don't have an account? <button type="button" id="switchToSignUp" class="inline-link bold">Sign up</button>
        </p>
      </footer>
    </div>
  </main>

  <!-- Forgot Password Modal -->
  <div id="forgotPasswordModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Reset password</h2>
        <button type="button" id="closeModalBtn" class="icon-button close-btn" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <p class="modal-desc">
        Enter the email associated with your account, and Firebase will send instructions to reset your password.
      </p>

      <form id="forgotPasswordForm" novalidate>
        <div class="form-group">
          <label for="resetEmail" class="form-label">Email address</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="resetEmail"
              class="form-input"
              placeholder="alex@example.com"
              required
            />
          </div>
          <span class="field-error" id="resetEmailError"></span>
        </div>

        <div class="modal-actions">
          <button type="button" id="cancelResetBtn" class="btn-secondary">Cancel</button>
          <button type="submit" id="submitResetBtn" class="btn-primary">
            <span class="btn-text">Send Instructions</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>
